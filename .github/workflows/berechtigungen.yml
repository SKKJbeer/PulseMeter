name: Einrichtung bei Apple

# **Warum das einen eigenen Ablauf hat.**
#
# Bis 0.79.1 lief `asc-berechtigungen.py` nur im TestFlight-Lauf mit. Das
# genügte, solange es einmal richtig ist — und war falsch, sobald man daran
# etwas nachbessern muss: Jeder Versuch kostete dann einen gemieteten Mac und
# eine Buildnummer, die verbraucht ist.
#
# Das Skript spricht nur HTTP. Es braucht kein Xcode, keinen Simulator und
# keinen Mac. Hier läuft es auf Linux, in Sekunden, so oft man will.
#
# Im TestFlight-Lauf bleibt derselbe Schritt stehen: Er ist dort die
# Selbstheilung, die vor dem Signieren noch einmal nachsieht. Zwei Orte,
# dasselbe Skript — nicht zwei Skripte.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  einrichten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Abhängigkeiten
        run: pip3 install --quiet "pyjwt[crypto]" requests pillow

      - name: Berechtigungen freischalten und nachlesen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 scripts/asc-berechtigungen.py

      # **Das Prüfbild kommt aus dem Zweig `screenshots`.**
      #
      # Apple will zu jedem Kauf ein Bildschirmfoto sehen, das zeigt, wo im
      # Programm er vorkommt — und ohne dieses eine Feld bleibt der Kauf auf
      # `MISSING_METADATA` und wird von StoreKit nicht ausgeliefert, auch nicht
      # in der Sandbox. Genau daran hing „ne kann nichts kaufen im TestFlight".
      #
      # Das Bild ist die Kaufseite aus dem letzten CI-Lauf. Es neu zu erzeugen
      # bräuchte einen Simulator und damit einen Mac; hier liegt es schon.
      - name: Bild der Kaufseite holen
        run: |
          git fetch --depth 1 origin screenshots
          mkdir -p build
          git show origin/screenshots:screenshot-pro-light.jpg > build/kaufseite.jpg
          ls -l build/kaufseite.jpg

      # **Die fünf Käufe.** Vom Gründer verlangt: „kannst du das nicht für mich
      # alles über eine API oder ähnliches anlegen?"
      #
      # Was hier entsteht, ist ein Entwurf: „Bereit zum Senden", sichtbar in der
      # Sandbox und damit in jedem TestFlight-Bau, dort kostenlos. Verkauft wird
      # erst mit der Einreichung der App.
      - name: Käufe anlegen und nachlesen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          PULSE_KAUFBILD: build/kaufseite.jpg
          # Schreibt am Ende aus, was Apple über die App und über einen Kauf
          # führt — auch dann, wenn alle fünf grün aussehen. Genau dieser Fall
          # steht an: fünfmal READY_TO_SUBMIT, und auf dem Gerät kein Knopf.
          PULSE_DIAGNOSE: "1"
        run: python3 scripts/asc-kaeufe.py
