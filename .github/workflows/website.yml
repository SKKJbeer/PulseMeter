name: Website veröffentlichen

# **Die Website geht bei jeder Änderung von selbst online.**
#
# Sie liegt als fertige Dateien in `docs/website/` — kein Bauwerkzeug, keine
# Abhängigkeiten, nichts zu übersetzen. Cloudflare Pages nimmt genau das
# entgegen und legt es auf sein Netz.
#
# Warum ein Ablauf und nicht die Anbindung ans Repository, die Cloudflare
# selbst anbietet: Dann läge der Auslöser bei Cloudflare, und die Prüfung
# hier hätte kein Wort mitzureden. So geht nur online, was `check-website.mjs`
# vorher durchgelassen hat — und dieselbe Prüfung sagt „nein", solange noch
# ein PLATZHALTER im Quelltext steht.
#
# ---
#
# **Einmalig einzurichten** (alles kostenlos, siehe docs/website/CLOUDFLARE.md):
#
#   1. Cloudflare-Konto anlegen, Bereich „Workers & Pages".
#   2. Dort ein Pages-Projekt namens `zaehlora` anlegen — „Direct Upload".
#   3. Ein API-Token erzeugen mit der Berechtigung „Cloudflare Pages: Edit".
#   4. Im Repository unter Settings › Secrets and variables › Actions zwei
#      Geheimnisse anlegen:
#        CLOUDFLARE_API_TOKEN    das Token aus Schritt 3
#        CLOUDFLARE_ACCOUNT_ID   steht in der Adresszeile des Dashboards
#
# Danach läuft es bei jedem Push auf `main`, der die Website anfasst.

on:
  push:
    branches: [main]
    paths:
      - "docs/website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Dasselbe Skript wie in `ci.yml` und `pruefen.sh`. Hier stand einmal ein
      # eigener Aufruf mit einer anderen Version — er installierte den Browser
      # ohne das Paket, und der Lauf fiel mit „Cannot find package
      # 'playwright'".
      - name: Chromium
        run: scripts/chromium-holen.sh

      # **Erst prüfen, dann veröffentlichen.** Eine Seite mit einer offenen
      # Textlücke im Impressum ist schlimmer als keine Seite.
      - name: Website prüfen
        run: node scripts/check-website.mjs

      # **Der Weg ohne ein einziges Geheimnis.** Cloudflare Pages hängt sich an
      # diesen Zweig und liest ihn aus; einzurichten ist das im Cloudflare-
      # Dashboard, das am Telefon funktioniert. Die GitHub-App dagegen hat
      # überhaupt keinen Einstellungsbereich — Geheimnisse lassen sich dort
      # nicht eintragen, und der Verweis darauf lief ins Leere.
      #
      # Die Prüfung behält trotzdem das letzte Wort: Dieser Schritt läuft nach
      # ihr, also sieht Cloudflare nie etwas, was nicht durchgekommen ist.
      - name: In den Zweig website legen
        run: scripts/website-zweig.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sind die Zugangsdaten da?
        id: zugang
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KONTO: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$KONTO" ]; then
            echo "bereit=nein" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare ist noch nicht eingerichtet — die Seite ist geprüft, aber nicht hochgeladen. Anleitung: docs/website/CLOUDFLARE.md"
          else
            echo "bereit=ja" >> "$GITHUB_OUTPUT"
          fi

      # Hochgeladen wird der **Auslieferordner**, nicht `docs/website/`. Dort
      # liegen zwei Anleitungen, die niemanden außer dem Gründer etwas angehen;
      # `website-fertig.sh` nimmt sie heraus — dasselbe Skript, das auch den
      # Zweig füllt.
      - name: Auslieferordner bauen
        if: steps.zugang.outputs.bereit == 'ja'
        run: scripts/website-fertig.sh build/website

      # **Auch das Projekt legt der Ablauf an.** Der erste Versuch von Hand
      # endete in Cloudflares eigenem Bau, der zweite mit „Project not found".
      # Ein Schritt, den ein Token erledigen kann, gehört nicht auf eine
      # Klickliste.
      - name: Pages-Projekt sicherstellen
        if: steps.zugang.outputs.bereit == 'ja'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/cloudflare-projekt.sh zaehlora main

      - name: Zu Cloudflare Pages hochladen
        if: steps.zugang.outputs.bereit == 'ja'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `--branch=main` macht daraus die **Produktionsfassung**, nicht eine
          # Vorschau. `--commit-dirty` schweigt die Warnung, dass der
          # Arbeitsordner Dateien enthält, die nicht im Repository stehen —
          # das ist hier der frisch gebaute Ordner selbst.
          command: pages deploy build/website --project-name=zaehlora --branch=main --commit-dirty=true

      # **Die alte Adresse blieb nach dem Umzug stehen** und lieferte eine
      # vollständige Kopie mit einem `canonical` auf sich selbst — zwei Seiten
      # mit gleichem Inhalt, jede das Original. Statt sie abzuschalten leitet
      # sie weiter: Alte Verweise bleiben gültig und geben ihr Gewicht ab.
      - name: Umleitung der alten Adresse bauen
        if: steps.zugang.outputs.bereit == 'ja'
        run: scripts/alte-adresse.sh

      - name: Alte Adresse umleiten
        if: steps.zugang.outputs.bereit == 'ja'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/umleitung --project-name=pulsemeter --branch=main --commit-dirty=true

      # Gemessen, nicht angenommen. Genau diese Annahme hat die alte Adresse
      # einen halben Tag als zweite Website stehen lassen.
      - name: Leitet die alte Adresse wirklich?
        if: steps.zugang.outputs.bereit == 'ja'
        run: |
          sleep 10
          scripts/alte-adresse.sh --pruefen

      - name: Was jetzt dasteht
        if: steps.zugang.outputs.bereit == 'ja'
        run: echo "::notice::Die Website steht auf https://zaehlora.pages.dev/"

      # **Die Änderung melden, statt zu warten, bis jemand vorbeikommt.**
      # Bing, Yandex und Seznam nehmen IndexNow an; über Bing kommen auch
      # DuckDuckGo und die Websuche von ChatGPT mit. Google nicht, dort gilt
      # die Search Console. Ein Fehler hier hält nichts auf: Die Website ist
      # zu diesem Zeitpunkt schon online.
      # **Gemessen an der echten Seite, nicht am Quelltext.** Bis 0.117.0
      # lieferte jede unbekannte Adresse die Startseite mit 200 aus, und
      # `/favicon.ico` ebenso. Im Quelltext war das nicht zu sehen, nur hier.
      # Gewartet wird, bis der neue Stand online ist: Cloudflare baut den Zweig
      # `website` erst nach dem Hochladen.
      - name: Antwortet die Website so, wie Google es braucht?
        run: |
          W=https://zaehlora.pages.dev
          schluessel=$(ls docs/website | grep -E '^[0-9a-f]{32}\.txt$' | sed 's/\.txt$//')
          for versuch in $(seq 1 12); do
            [ "$(curl -fsS "$W/$schluessel.txt" 2>/dev/null || true)" = "$schluessel" ] && break
            sleep 20
          done
          fehler=0
          pruefe() { if [ "$2" = "$3" ]; then echo "✓ $1"; else echo "::error::$1: $2 statt $3"; fehler=1; fi; }
          pruefe "Unbekannte Adresse antwortet mit 404" "$(curl -sS -o /dev/null -w '%{http_code}' "$W/gibt-es-nicht-$GITHUB_RUN_ID")" 404
          # Nur die Hauptart: Cloudflare nennt ICO mal `image/x-icon`, mal
          # `image/vnd.microsoft.icon`. Falsch ist nur `text/html`.
          pruefe "Symbol ist ein Bild" "$(curl -sS -o /dev/null -w '%{content_type}' "$W/favicon.ico" | cut -d'/' -f1)" image
          pruefe "Sitemap ist erreichbar" "$(curl -sS -o /dev/null -w '%{http_code}' "$W/sitemap.xml")" 200
          pruefe "Startseite ist erreichbar" "$(curl -sS -o /dev/null -w '%{http_code}' "$W/")" 200
          pruefe "Bilder bleiben eine Woche" "$(curl -sSI "$W/bilder/light.jpg" | tr -d '\r' | grep -i '^cache-control:' | cut -d' ' -f2-)" "public, max-age=604800, stale-while-revalidate=86400"
          exit $fehler

      - name: Bei IndexNow melden
        continue-on-error: true
        run: scripts/indexnow.sh
