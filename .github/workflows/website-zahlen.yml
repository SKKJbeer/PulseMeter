name: Website-Zahlen

# **Wie die Website gefunden wird, einmal die Woche.** Liest die Zählung, die
# `docs/website-server/_middleware.js` auf dem Server schreibt, und legt Summen
# je Seite, Herkunft, Gerät und Land in die Zusammenfassung dieses Laufs.
#
# Das Repository ist öffentlich, also auch diese Zusammenfassung. Es stehen
# darin nur Summen. Wer das nicht will, schaltet den Ablauf unter Actions ab.
#
# Dazu, was Google sieht: Suchbegriffe, Einblendungen und Klicks aus der
# Search Console, und bei jedem Lauf die Sitemap neu gemeldet.
#
# **Einmalig einzurichten**, beides in `docs/13-zugaenge.md`: ein
# Cloudflare-Token mit genau einem Recht, „Account Analytics: Read", als
# `CLOUDFLARE_STATISTIK_TOKEN`, und ein Google-Dienstkonto als
# `GOOGLE_SC_SCHLUESSEL`.

on:
  schedule:
    # Montags früh, nicht zur vollen Stunde: Zur vollen Stunde startet halb
    # GitHub, und ein Zeitplan dort ist ohnehin keine Zusage.
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      tage:
        description: "Wie viele Tage zurück (Website)"
        default: "7"

permissions:
  contents: read

jobs:
  zahlen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # **Erst der eigene Leseschlüssel, sonst der zum Hochladen.** Ob der
      # schon lesen darf, hängt davon ab, wie er einmal angelegt wurde; das
      # weiß niemand mehr, also wird es versucht. Scheitert es, sagt der Lauf,
      # welcher Schlüssel fehlt, und bleibt grün: Ein fehlender Bericht ist
      # kein Fehler an der Website.
      - name: Aufrufe der Website
        continue-on-error: true
        env:
          CLOUDFLARE_STATISTIK_TOKEN: ${{ secrets.CLOUDFLARE_STATISTIK_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_STATISTIK_TOKEN" ]; then
            echo "::notice::Kein Cloudflare-Schlüssel. Anleitung: docs/13-zugaenge.md"
            exit 0
          fi
          python3 scripts/website-zahlen.py "${{ inputs.tage || '7' }}" || {
            echo "::warning::Die Zählung ließ sich nicht lesen. Meist fehlt der Leseschlüssel CLOUDFLARE_STATISTIK_TOKEN oder Analytics Engine ist noch aus. Anleitung: docs/13-zugaenge.md"
            exit 1
          }

      - name: Google (Search Console)
        continue-on-error: true
        env:
          GOOGLE_SC_SCHLUESSEL: ${{ secrets.GOOGLE_SC_SCHLUESSEL }}
        run: |
          if [ -z "$GOOGLE_SC_SCHLUESSEL" ]; then
            echo "::notice::Kein Google-Dienstkonto. Anleitung: docs/13-zugaenge.md"
            exit 0
          fi
          pip3 install --quiet google-auth requests
          python3 scripts/gsc-zahlen.py 28
