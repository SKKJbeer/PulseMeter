name: TestFlight

# **Der Weg ohne eigenen Mac.**
#
# Die CI hat einen: `ci.yml` baut die App bei jedem Push auf `macos-15`. Was
# dort fehlte, war das Signieren und das Hochladen — und beides geht headless,
# wenn man Xcode einen App-Store-Connect-Schlüssel gibt statt eines
# Anmeldefensters. Damit fällt der Mac des Gründers als Voraussetzung weg: Der
# Lauf wird im Browser gestartet (auch auf dem Telefon), und die fertige App
# kommt über TestFlight zurück aufs Gerät.
#
# **Was das nicht ersetzt.** Die App landet damit in TestFlight, nicht im
# Store. Und `scripts/aufs-handy.sh` bleibt der schnellere Weg, wenn ein Mac
# und ein Kabel zur Hand sind: zwei Minuten statt zwanzig.
#
# ---
#
# **Einmalig einzurichten, alles im Browser** (siehe `docs/go-live-anleitung.html`):
#
#   1. App Store Connect › Users and Access › Integrations › App Store Connect
#      API › Schlüssel erzeugen, Rolle **App Manager**.
#      Die `.p8`-Datei lässt sich **nur einmal** laden — verliert man sie, muss
#      ein neuer Schlüssel her.
#   2. Im Repository unter Settings › Secrets and variables › Actions vier
#      Geheimnisse anlegen:
#        ASC_KEY_ID      — die Key-ID, zehn Zeichen
#        ASC_ISSUER_ID   — die Issuer-ID, eine UUID, steht über der Liste
#        ASC_KEY_P8      — der **ganze Inhalt** der .p8-Datei, mit den
#                          BEGIN/END-Zeilen
#        ASC_TEAM_ID     — die Team-ID, zehn Zeichen, steht unter Membership
#   3. In App Store Connect die App anlegen, Bundle-ID `de.karjoth.pulsemeter`.
#
# Danach: Actions › TestFlight › Run workflow.

on:
  workflow_dispatch:
    inputs:
      hinweis:
        description: "Was ist neu? Steht später bei den Testern."
        required: false
        default: "Neuer Stand zum Ausprobieren."

permissions:
  contents: read

jobs:
  hochladen:
    runs-on: macos-15
    timeout-minutes: 60
    # Zwei Uploads gleichzeitig wären zwei Bauten mit derselben Buildnummer,
    # und den zweiten lehnt App Store Connect ab.
    concurrency:
      group: testflight
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # **Das neueste Xcode wählen, nicht das voreingestellte.**
      #
      # Lauf 4 wurde von Apple angenommen und dann abgelehnt: „This app was
      # built with the iOS 18.5 SDK. All iOS and iPadOS apps must be built with
      # the iOS 26 SDK or later." Der Läufer stand auf Xcode 16.4. Apple lässt
      # ältere SDKs für neue Uploads nicht mehr durch — das ist eine Frist, die
      # verstrichen ist, kein Fehler im Projekt.
      #
      # Gewählt wird deshalb die höchste vorhandene Fassung. Reicht keine, hält
      # der Lauf hier an und **listet auf, was es gibt** — sonst rät man beim
      # nächsten Versuch am Läuferbild vorbei.
      - name: Xcode wählen
        run: |
          echo "Vorhanden:"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (keins)"
          neuste=""; hoechste=0; version=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            v=$(defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo 0)
            haupt=${v%%.*}
            case "$haupt" in ''|*[!0-9]*) continue ;; esac
            if [ "$haupt" -ge "$hoechste" ]; then
              hoechste=$haupt; neuste="$app"; version=$v
            fi
          done
          [ -n "$neuste" ] || { echo "::error::Kein Xcode auf dem Laeufer."; exit 1; }
          echo "Gewaehlt: $neuste ($version)"
          sudo xcode-select -s "$neuste/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
          if [ "$hoechste" -lt 26 ]; then
            echo "::error::Nur Xcode $version vorhanden, Apple verlangt 26 oder neuer fuer neue Uploads. Der Laeufer braucht ein anderes Bild - in runs-on auf macos-26 wechseln."
            exit 1
          fi

      # **Zuerst prüfen, ob überhaupt eingerichtet ist.** Ohne das läuft der
      # Auftrag zwanzig Minuten und scheitert am Ende mit einer Meldung von
      # `altool`, die nicht sagt, welches der vier Geheimnisse fehlt.
      - name: Zugang prüfen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          fehlt=""
          [ -n "$ASC_KEY_ID" ]    || fehlt="$fehlt ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || fehlt="$fehlt ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ]    || fehlt="$fehlt ASC_KEY_P8"
          [ -n "$ASC_TEAM_ID" ]   || fehlt="$fehlt ASC_TEAM_ID"
          if [ -n "$fehlt" ]; then
            echo "::error::Diese Geheimnisse fehlen:$fehlt — siehe Kopf von .github/workflows/testflight.yml"
            exit 1
          fi
          echo "Alle vier Angaben liegen vor."

      # Der Schlüssel muss an zwei Orten liegen: `xcodebuild` bekommt ihn über
      # einen Pfad, `altool` sucht ihn von sich aus in `~/.appstoreconnect`.
      - name: Schlüssel ablegen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          cp ~/private_keys/AuthKey_$ASC_KEY_ID.p8 ~/.appstoreconnect/private_keys/
          chmod 600 ~/private_keys/AuthKey_$ASC_KEY_ID.p8

      # **Das eigene Zertifikat, wenn es eins gibt.**
      #
      # Ohne diesen Schritt legt Xcode auf jedem frischen Läufer ein neues an,
      # und nach dem dritten ist die Grenze erreicht — dann steht man vor
      # Handarbeit im Portal, ausgerechnet an dem Weg, der Handarbeit sparen
      # soll. Einmal `zertifikat.yml` laufen lassen, und ab da führt jeder Bau
      # dasselbe Zertifikat mit sich.
      #
      # Der Schlüsselbund ist ein eigener, kein Anmeldebund: Der Läufer wird
      # nach dem Lauf verworfen, aber ein Geheimnis gehört trotzdem nicht in
      # den Bund, in dem alles andere liegt.
      - name: Zertifikat einlesen
        id: zertifikat
        env:
          P12: ${{ secrets.DIST_P12_BASE64 }}
          P12_PASS: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "eigenes=0" >> "$GITHUB_OUTPUT"
            echo "::warning::Kein eigenes Zertifikat hinterlegt — Xcode legt eins an. Erlaubt sind drei; danach 'Zertifikat anlegen' einmal laufen lassen."
            exit 0
          fi
          BUND="$RUNNER_TEMP/signatur.keychain-db"
          BUND_PASS=$(openssl rand -base64 24)
          security create-keychain -p "$BUND_PASS" "$BUND"
          security set-keychain-settings -lut 3600 "$BUND"
          security unlock-keychain -p "$BUND_PASS" "$BUND"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signatur.p12"
          # `-A` erlaubt allen Programmen den Zugriff; `-T` einzeln wäre
          # sauberer, führt aber bei `codesign` zu einer Rückfrage, die auf
          # einem Läufer niemand beantwortet.
          security import "$RUNNER_TEMP/signatur.p12" -k "$BUND" \
            -P "$P12_PASS" -A -t cert -f pkcs12
          security list-keychain -d user -s "$BUND" login.keychain-db
          # Ohne diese Zeile fragt `codesign` beim Signieren nach dem Kennwort
          # des Bundes — und wartet, bis der Auftrag in die Zeitgrenze läuft.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$BUND_PASS" "$BUND" >/dev/null
          rm -f "$RUNNER_TEMP/signatur.p12"
          echo "eigenes=1" >> "$GITHUB_OUTPUT"
          security find-identity -v -p codesigning "$BUND"

      - name: Zeichenketten und Angriffsfläche
        run: |
          python3 scripts/check-strings.py
          scripts/check-sicherheit.sh

      # Der Rechenkern zuerst. Ein Upload eines Standes, dessen Rechnung falsch
      # ist, kostet Tester-Vertrauen und eine Woche.
      - name: PulseCore
        run: swift test --package-path Packages/PulseCore

      - name: XcodeGen
        run: brew install xcodegen

      # **Die Buildnummer kommt aus der Laufnummer.** App Store Connect nimmt
      # jede Nummer nur ein einziges Mal an; zweimal `1` hochzuladen scheitert
      # nach zwanzig Minuten, und zwar erst beim letzten Schritt.
      - name: Xcode-Projekt erzeugen
        run: |
          xcodegen generate
          echo "Buildnummer ${{ github.run_number }}"

      # **Verteilprofile, weil es ohne Gerät keine Entwicklungsprofile gibt.**
      #
      # Die Läufe 1 und 2 scheiterten beide an derselben Meldung: „Your team has
      # no devices from which to generate a provisioning profile." Der Grund ist
      # nicht die Konfiguration, sondern die Signierart — `xcodebuild archive`
      # mit `Automatic` besorgt sich ein Development-Profil und signiert erst
      # beim Ausführen auf Verteilung um. Ohne registriertes Gerät gibt es
      # dieses Profil nicht, und ein Konto ohne Kabel hat kein Gerät.
      #
      # Also von Hand: App-Store-Profile über dieselbe Schnittstelle, über die
      # auch das Zertifikat kam.
      - name: Verteilprofile anlegen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          PULSE_BUNDLE_IDS: "de.karjoth.pulsemeter de.karjoth.pulsemeter.widget"
        run: |
          pip3 install --quiet --break-system-packages "pyjwt[crypto]" requests
          python3 scripts/asc-profil.py

      - name: Archivieren und signieren
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          # `-allowProvisioningUpdates` zusammen mit dem Schlüssel ist der
          # Kern der Sache: Xcode legt App-ID, App-Gruppe, iCloud-Container,
          # Zertifikat und Profil selbst an — ohne Anmeldefenster und ohne
          # dass jemand im Portal etwas anklickt.
          # **`-configuration Release` ist nicht Feinschliff.** Ohne die Angabe
          # nahm der erste Lauf `Debug`, und Xcode suchte daraufhin ein
          # **Development**-Profil — samt der Meldung „your team has no devices
          # from which to generate a provisioning profile". Für einen
          # Store-Bau braucht es ein Verteilprofil, und das gibt es nur zur
          # Release-Konfiguration.
          xcodebuild archive \
            -project PulseMeter.xcodeproj \
            -scheme PulseMeter \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/PulseMeter.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -quiet \
            DEVELOPMENT_TEAM="$ASC_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            PULSE_PROFILE_APP="$PULSE_PROFILE_APP" \
            PULSE_PROFILE_WIDGET="$PULSE_PROFILE_WIDGET" \
            PULSE_ENTITLEMENTS_APP="" \
            PULSE_ENTITLEMENTS_WIDGET="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

          # **Warum die Berechtigungen bei diesem Bau leer bleiben.**
          # App-Gruppe, iCloud und Push müssen an der App-ID im Portal
          # freigeschaltet sein, sonst lehnt Apple das Profil ab. Sie sind es
          # noch nicht. Ohne sie läuft die App vollständig — nur das Widget
          # bleibt leer und der iCloud-Abgleich aus; für beides gibt es im Code
          # einen Rückfall, der genau dafür gebaut ist. Und die zwei Wochen
          # Eigennutzung, an denen alles hängt, können sofort anfangen
          # (docs/07-v1-plan.md, Abschnitt 5).

      - name: Ausfuhrvorgaben schreiben
        env:
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          # `app-store-connect` heißt der Wert seit Xcode 15.3; davor
          # `app-store`. Der alte wird noch angenommen, aber mit Warnung.
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$ASC_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>de.karjoth.pulsemeter</key><string>$PULSE_PROFILE_APP</string>
              <key>de.karjoth.pulsemeter.widget</key><string>$PULSE_PROFILE_WIDGET</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <!-- Kein Bitcode: Apple nimmt es seit Xcode 14 nicht mehr an. -->
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

      - name: Ausführen als IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/PulseMeter.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la build/ipa

      - name: Zu TestFlight hochladen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(find build/ipa -name "*.ipa" | head -1)
          [ -n "$IPA" ] || { echo "::error::Keine .ipa entstanden."; exit 1; }
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      # Auch bei einem Fehlschlag: Das Protokoll des Signierens ist das, woran
      # sich der erste Lauf erfahrungsgemäß entscheidet.
      - name: Protokolle sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-protokolle
          path: |
            build/*.log
            build/ExportOptions.plist
          if-no-files-found: ignore
          retention-days: 14

      - name: Was jetzt passiert
        run: |
          cat <<'ENDE'

          Hochgeladen. Was jetzt von allein passiert:

            · Apple prüft den Bau automatisch. Das dauert 5 bis 30 Minuten.
            · Danach steht er in App Store Connect unter TestFlight.
            · Beim allerersten Bau fragt Apple einmal nach der
              Ausfuhr-Verschlüsselung. Antwort für diese App: nein, es wird
              keine nicht-standardmäßige Verschlüsselung verwendet.

          Dann in der TestFlight-App auf dem iPhone anmelden — dieselbe
          Apple-ID — und installieren.

          ENDE
