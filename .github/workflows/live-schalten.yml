name: Live schalten

# **Der letzte Handgriff, der sonst liegenbleibt.**
#
# Auf der Website steht „Bald im App Store". Sobald Apple freigibt, ist das
# falsch — und zwar in die unangenehme Richtung: Die App ist da, und die eigene
# Seite sagt, sie sei es nicht. Umgekehrt wäre es schlimmer, den Verweis vorher
# zu setzen; er führte auf eine Fehlseite, und genau das verbietet sich dieses
# Projekt (`docs/09-appstore.md`).
#
# Es gibt also ein Zeitfenster von Stunden, in dem jemand einen Befehl tippen
# müsste. Am Starttag ist die Liste lang, und dieser Punkt steht ganz unten.
# Also fragt dieser Ablauf nach und legt den Knopf selbst um.
#
# **Der Stundenplan ist kein Versprechen, und das ist gemessen.** Hier stand
# „fragt stündlich nach". Am 29. August lag der Ablauf ab 12:12 UTC auf `main`
# und feuerte in sechs Stunden **einmal** — um 16:47 statt um :23, danach
# wieder nicht. GitHub reiht geplante Läufe bei Last ein und lässt sie aus; in
# einem Depot, in dem wenig los ist, kann das Stunden bedeuten.
#
# Für diesen Ablauf ist das erträglich, weil er nur einmal im Leben etwas tut
# und ein paar Stunden „Bald im App Store" niemanden schaden. Verlassen darf
# man sich darauf trotzdem nicht: **Am Starttag wird er von Hand ausgelöst**
# (`workflow_dispatch`) und die Seite danach angesehen. So steht es auch in
# `docs/12-auslieferung.md`.
#
# **Er schaltet nur in eine Richtung.** Zurück geht es von Hand
# (`scripts/appstore-knopf.sh aus`) — ein Ablauf, der von selbst wieder
# abschaltet, wäre bei einem kurzen Aussetzer der Schnittstelle eine Website,
# die den Laden verleugnet.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

# `actions: write` ist nicht Zierde, sondern der Unterschied zwischen „gepusht"
# und „steht im Netz". Ein Push mit dem `GITHUB_TOKEN` löst **keinen** weiteren
# Ablauf aus — deshalb stößt der letzte Schritt `website.yml` von Hand an, und
# genau das beantwortete GitHub am 5. September mit „Resource not accessible by
# integration". Der Knopf war umgelegt, der Lauf rot, die Seite unverändert: Die
# App stand im Laden und die eigene Website sagte „Bald im App Store".
permissions:
  contents: write
  actions: write

jobs:
  nachsehen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Abhängigkeiten
        run: pip3 install --quiet "pyjwt[crypto]" requests

      - name: Steht die App im Laden?
        id: laden
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 scripts/asc-laden.py

      - name: Knopf umlegen und veröffentlichen
        id: knopf
        if: steps.laden.outputs.live == 'ja'
        run: |
          if [ "$(scripts/appstore-knopf.sh | head -1)" = "App-Store-Abzeichen: an" ]; then
            echo "umgelegt=nein" >> "$GITHUB_OUTPUT"
            echo "::notice::Der Knopf steht schon auf an. Nichts zu tun."
            exit 0
          fi
          echo "umgelegt=ja" >> "$GITHUB_OUTPUT"
          scripts/appstore-knopf.sh an
          git config user.name  "Zaehlora"
          git config user.email "noreply@zaehlora.app"
          git add docs/website/index.html
          git commit -m "The App Store badge now points at the store" \
                     -m "Flipped automatically the hour the store state turned READY_FOR_SALE. The badge is no longer a promise but a link."
          git push
          echo "::notice::Knopf umgelegt und gepusht. Der Website-Lauf folgt."

      # Der Push allein ändert die Seite im Netz nicht — die Website wird
      # veröffentlicht, nicht aus dem Zweig gelesen.
      #
      # Bedingung ist der **umgelegte Knopf**, nicht die Freigabe im Laden. Sonst
      # stieße dieser Ablauf von der Freigabe an stündlich eine Veröffentlichung
      # an, die nichts ändert.
      - name: Website veröffentlichen
        if: steps.knopf.outputs.umgelegt == 'ja'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'website.yml',
              ref: 'main',
            });
            core.notice('Website-Lauf angestoßen.');

      # **Geprüft wird das Außen, nicht der Push.** Am 5. September war der
      # Commit da, der Lauf danach rot und niemand sah hin: Die App stand im
      # Laden, die Seite sagte weiter „Bald im App Store". Ein Ablauf, der etwas
      # nach außen bringt, ruft am Ende die Adresse ab.
      #
      # Die Bedingung ist die Freigabe, nicht der umgelegte Knopf — so läuft
      # diese Prüfung stündlich weiter und merkt es auch dann, wenn die
      # Veröffentlichung ein andermal danebengeht. Die Adresse kommt aus dem
      # `canonical` der Seite; sie hier ein viertes Mal hinzuschreiben wäre
      # genau die Art Doppelung, die still auseinanderläuft.
      - name: Steht das Abzeichen wirklich im Netz?
        if: steps.laden.outputs.live == 'ja'
        run: |
          adresse=$(grep -o 'rel="canonical" href="https://[^"/]*' docs/website/index.html | head -1 | sed 's|.*https://||')
          echo "Sehe nach auf https://$adresse"
          # Zehn Versuche über fünf Minuten. Der Veröffentlichungslauf braucht
          # knapp zwei Minuten, und angestoßen wurde er eben erst — beim ersten
          # Blick kann die alte Seite noch dastehen.
          for versuch in $(seq 1 10); do
            if curl -sS "https://$adresse" | grep -q 'apps.apple.com'; then
              echo "::notice::Das Abzeichen verweist auf den Laden."
              exit 0
            fi
            echo "Versuch $versuch: noch nicht da."
            sleep 30
          done
          echo "::error::Die App ist freigegeben, aber https://$adresse verweist nach fünf Minuten nicht auf den Laden. Der Veröffentlichungslauf ist nicht durchgekommen."
          exit 1
