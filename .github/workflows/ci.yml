name: CI

# Läuft auf einem macOS-Läufer, weil SwiftData, SwiftUI und der Simulator
# nur dort existieren. Damit lässt sich alles prüfen, was auf einem
# Linux-Rechner nicht übersetzt werden kann — ohne einen Mac zur Hand zu haben.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

# Auf den Zweignamen normalisiert, nicht auf `github.ref`: Bei offener
# Pull-Request liefert ein Push zwei Ereignisse — `push` mit
# `refs/heads/claude/x` und `pull_request` mit `refs/pull/1/merge`. Als
# verschiedene Gruppen liefen beide durch und bauten dieselbe App zweimal.
# Über den Zweignamen landen sie in derselben Gruppe, und der spätere Lauf
# bricht den früheren ab.
# Das `-2` am Ende ist kein Schmuck: Ein Lauf blieb in einem Zustand hängen,
# den GitHub weder startet noch abbrechen lässt („Cannot cancel a workflow
# re-run that has not yet queued"). Solange er in der Gruppe steht, entstehen
# für neue Pushes gar keine Läufe mehr — drei Pushes hintereinander blieben
# unbemerkt liegen. Ein neuer Gruppenname lässt den Blockierer zurück.
#
# Zweiter Befund desselben Tages, hier festgehalten statt behoben:
# `cancel-in-progress` bewertet „neu" nach **Startzeit**, nicht nach
# Commit-Reihenfolge. Wartet ein Lauf lange auf einen Läufer, kann er dadurch
# einen jüngeren erschlagen. Das ist selten und kostet einen Lauf; die Regel
# bleibt, weil sie im Normalfall genau das Richtige tut.
# **Die Nebenläufigkeit liegt seit 0.33.0 je Auftrag, nicht über dem Ganzen.**
# Zusammen bewirkten die beiden Regeln oben nämlich genau das Gegenteil dessen,
# wofür sie da sind: Bei zügiger Arbeit brach jeder neue Push den laufenden
# App-Build ab — an einem Tag drei Mal, jedes Mal kurz vor dem Ende und ohne je
# ein Ergebnis geliefert zu haben. Wer nicht am Mac sitzt, stand danach ohne
# jede Aussage da.
#
# Die schnelle Prüfung darf weiter abgebrochen werden: Sie dauert eine Minute,
# und das Ergebnis eines überholten Standes interessiert niemanden. Der
# App-Build darf es nicht — er ist die einzige Aussage über die App, wenn
# gerade niemand an einem Mac sitzt, und ein abgebrochener Lauf ist keine.

# Schreibrecht nur, weil der Lauf die Screenshots in einen eigenen Zweig legt.
# Sonst bliebe es beim Lesen.
permissions:
  contents: write

jobs:
  # Eigener Auftrag auf Linux: Der Entwurf braucht keinen macOS-Läufer, und
  # die sind knapp. So läuft diese Prüfung auch dann, wenn der App-Build
  # stundenlang in der Warteschlange hängt — und sie läuft in einer Minute.
  #
  # Es gab sie bisher nicht, und das hat gekostet: Ein frisch angelegter
  # Zähler ließ sich im Entwurf nicht ablesen. Gefunden hat es der Gründer
  # beim Ausprobieren.
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: entwurf-${{ github.event.pull_request.head.ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Chromium
        run: scripts/chromium-holen.sh
      - name: Klick-Dummy prüfen
        run: node scripts/check-prototype.mjs

      # Zwei Prüfungen der iOS-Quellen, die kein Xcode brauchen — reines Lesen.
      # Sie standen bisher nur in `pruefen.sh`, und damit war die CI-Beschreibung
      # von der lokalen Prüfung abgewichen; CLAUDE.md warnt genau davor. Hier
      # oben statt beim App-Build: Ein Läufer für Linux ist sofort da, ein Mac
      # steht in der Warteschlange.
      - name: Trefferflächen
        run: python3 scripts/check-trefferflaechen.py
      - name: Aktualisierung
        run: python3 scripts/check-aktualisierung.py

      # Bedienbarkeit und Geschwindigkeit: Trefferflächen, Kontrast, Namen für
      # die Vorlesefunktion, gemessene Zeiten — und die Produktprinzipien 2 bis
      # 4, gezählt statt behauptet. Braucht dasselbe Chromium wie der Entwurf.
      - name: Bedienbarkeit und Geschwindigkeit
        run: node scripts/check-nichtfunktional.mjs

      # Dieselbe Maschine, dasselbe Chromium, kein zusätzlicher Auftrag: Die
      # Website ist statisch und in zwanzig Sekunden geprüft. Der erste Lauf
      # nach 0.43.0 hat gezeigt, warum das hier stehen muss — lokal hängt die
      # Prüfung in `pruefen.sh`, die CI ruft aber die Skripte einzeln auf und
      # hätte die Seite auf Dauer ungeprüft mitgeführt.
      - name: Website prüfen
        run: node scripts/check-website.mjs

  # **Läuft wieder bei jedem Push**, auch auf einen Arbeitszweig.
  #
  # In 0.32.5 war er auf `main`, Pull-Requests und Zuruf beschränkt worden, weil
  # ein Mac dasselbe in zwei statt fünfzehn Minuten prüft. Das stimmt — gilt
  # aber nur, **wenn jemand am Mac sitzt**. Sonst war die Folge, dass ein
  # Arbeitszweig gar nicht mehr geprüft wurde und der Gründer ohne jede Aussage
  # über die App dastand. Genau dafür gibt es diesen Auftrag.
  #
  # Er bleibt trotzdem die Gegenprobe und nicht der erste Durchgang: Wer am Mac
  # sitzt, hat sein Ergebnis lange vorher, und der Zweig `pruefungen` sagt, ob
  # das der Fall war.
  #
  # `cancel-in-progress: false` — anders als bei der schnellen Prüfung. Ein
  # abgebrochener App-Build ist keine Aussage, sondern eine verlorene
  # Viertelstunde. Lieber laufen zwei hintereinander als keiner zu Ende.
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    concurrency:
      group: app-${{ github.event.pull_request.head.ref || github.ref_name }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Umgebung
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes | grep iOS || true

      # Kostet eine Sekunde und fängt einen Fehler ab, der sonst erst nach
      # zwei Minuten Übersetzung auffällt: ein deutsches Anführungszeichen,
      # das eine Swift-Zeichenkette an der falschen Stelle beendet.
      - name: Zeichenketten
        run: python3 scripts/check-strings.py
      # Ein fehlender Import ist syntaktisch fehlerfrei und bricht erst beim
      # Ausführen ab. Bau 24 lag schon in TestFlight, als der Schritt danach an
      # einem fehlenden `import re` starb — der Bau war bezahlt, die Testhinweise
      # fehlten, und gesehen hat es niemand vorher.
      - name: Unbekannte Namen
        run: |
          pip3 install --quiet --break-system-packages pyflakes
          python3 scripts/check-namen.py
      - name: Angriffsfläche
        run: scripts/check-sicherheit.sh


      # Reines Parsen der iOS-Quellen, ohne SDK. Kostet Sekunden und fängt
      # einen Block ab, der in der falschen Struktur gelandet ist — 0.32.0 ging
      # genau daran zu Bruch, und zwar erst nach dem Paketbau.
      - name: Syntax der iOS-Quellen
        run: swiftc -parse App/*.swift Packages/PulseUI/Sources/PulseUI/*.swift Widget/*.swift AppUITests/*.swift

      # Die Domäne zuerst: schnell, und wenn sie bricht, ist alles andere egal.
      - name: PulseCore
        run: swift test --package-path Packages/PulseCore

      # Braucht SwiftData; das macOS-Ziel des Pakets reicht, kein Simulator.
      - name: PulseData
        run: swift test --package-path Packages/PulseData

      # PulseUI ist iOS-only und wird beim App-Build mit übersetzt; ein
      # eigener Testlauf auf macOS ginge nicht.
      - name: XcodeGen
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: App bauen und Oberflächentests
        run: scripts/test.sh app

      # Verwendet den Build aus dem Testschritt weiter — ein zweiter
      # vollständiger Build kostet auf einem macOS-Läufer mehrere Minuten.
      #
      # **`always()` und nicht `success()`.** Mit `success()` unterdrückte eine
      # einzige rote Prüfung alle sechzehn Bilder — und damit die produktivste
      # Prüfung, die dieses Projekt hat. Genau verkehrt herum: Wenn etwas nicht
      # stimmt, braucht man die Bilder mehr als sonst. Ein ganzer Nachmittag
      # ist so blind vergangen, weil ein Test rot war und deshalb nichts zu
      # sehen gab.
      #
      # `continue-on-error`, damit ein gescheiterter Bilderlauf das Ergebnis
      # nicht überschreibt: Rot bleibt rot, aus dem Grund, aus dem es rot war.
      - name: Screenshots
        if: always()
        continue-on-error: true
        run: scripts/run.sh build

      # Die Bilder zusätzlich in einen Zweig, nicht nur ins Artefakt: An ein
      # Artefakt komme ich aus der Entwicklungsumgebung heraus nicht heran —
      # der Weg zur GitHub-API ist dort gesperrt, git aber nicht. Und ohne die
      # Bilder fehlt die produktivste Prüfung, die dieses Projekt hat.
      - name: Screenshots in den Zweig
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Der Zweig soll sagen, aus welchem Zustand die Bilder stammen.
          PULSE_LAUF: ${{ job.status == 'success' && 'grün' || 'rot' }}
        run: scripts/publish-shots.sh build

      - name: Ergebnisse sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-und-protokolle
          path: |
            build/*.png
            build/*.log
          if-no-files-found: ignore
          retention-days: 14
