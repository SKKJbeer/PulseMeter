name: Einreichung nachsehen

# **Was der App Store noch verlangt — gefragt, nicht erinnert.**
#
# Die Liste in `docs/09-appstore.md` wurde von Hand gepflegt und war beim
# Nachsehen falsch: StoreKit stand als offen, obwohl die fünf Käufe seit Tagen
# bereit sind. Eine Liste, die nachgeführt werden muss, ist am Tag nach dem
# Nachführen wieder veraltet.
#
# Dieser Lauf fragt stattdessen Apple. Er schreibt nichts und kostet Sekunden;
# er darf deshalb so oft laufen, wie jemand wissen will, wo es steht.

on:
  workflow_dispatch:
    inputs:
      fuellen:
        description: "Auch eintragen, was aus dem Repository kommt?"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  nachsehen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Abhängigkeiten
        run: pip3 install --quiet "pyjwt[crypto]" requests

      # Die Bilder in voller Größe liegen im Zweig `screenshots`, den die CI
      # bei jedem Lauf überschreibt. Sie hier zu erzeugen bräuchte einen
      # Simulator und damit einen Mac; dort liegen sie schon.
      - name: Bildschirmfotos holen
        run: |
          git fetch --depth 1 origin screenshots
          mkdir -p build/store
          git archive origin/screenshots store 2>/dev/null | tar -x -C build --strip-components=1 || \
            echo "::notice::Im Zweig screenshots gibt es noch keine Bilder in voller Größe — der nächste Mac-Lauf legt sie an."
          ls -la build/store 2>/dev/null | head -8

      - name: Nachsehen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ "${{ inputs.fuellen }}" = "true" ]; then
            python3 scripts/asc-einreichung.py --fuellen
          else
            python3 scripts/asc-einreichung.py
          fi
