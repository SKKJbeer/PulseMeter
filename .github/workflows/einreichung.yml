name: Einreichung nachsehen

# **Was der App Store noch verlangt — gefragt, nicht erinnert.**
#
# Die Liste in `docs/09-appstore.md` wurde von Hand gepflegt und war beim
# Nachsehen falsch: StoreKit stand als offen, obwohl die fünf Käufe seit Tagen
# bereit sind. Eine Liste, die nachgeführt werden muss, ist am Tag nach dem
# Nachführen wieder veraltet.
#
# Dieser Lauf fragt stattdessen Apple. Er schreibt nichts und kostet Sekunden;
# er darf deshalb so oft laufen, wie jemand wissen will, wo es steht.

on:
  workflow_dispatch:
    inputs:
      fuellen:
        description: "Auch eintragen, was aus dem Repository kommt?"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  nachsehen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Abhängigkeiten
        run: pip3 install --quiet "pyjwt[crypto]" requests pyflakes

      # Die Bilder in voller Größe liegen im Zweig `screenshots`, den die CI
      # bei jedem Lauf überschreibt. Sie hier zu erzeugen bräuchte einen
      # Simulator und damit einen Mac; dort liegen sie schon.
      # **Ohne `--strip-components`.** Der erste Anlauf hatte es gesetzt, und
      # damit schnitt es genau den Ordner weg, den es behalten sollte: Das
      # Archiv führt `store/…`, gestrippt landete alles direkt in `build/`, und
      # `build/store` blieb leer. Der Lauf meldete brav fünfmal „liegt nicht im
      # Zweig" — richtig beobachtet, falsche Ursache vermutet.
      - name: Bildschirmfotos holen
        run: |
          mkdir -p build
          git fetch --depth 1 origin screenshots
          git archive origin/screenshots store | tar -x -C build
          anzahl=$(find build/store -name "*.jpg" 2>/dev/null | wc -l | tr -d " ")
          echo "::notice::$anzahl Bilder in voller Größe aus dem Zweig screenshots."
          [ "$anzahl" -gt 0 ] || echo "::warning::Keine Bilder — der nächste Mac-Lauf legt sie an."

      - name: Nachsehen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          # Steht nicht im Impressum und deshalb auch nicht im Repository.
          # Fehlt sie, trägt der Lauf den Kontakt gar nicht ein — Apple nimmt
          # ihn nur vollständig — und sagt das in einer Zeile.
          ASC_KONTAKT_TELEFON: ${{ secrets.ASC_KONTAKT_TELEFON }}
          # Darf von der im Impressum abweichen — der rechtliche Kontakt und
          # der, unter dem ein Prüfer nachfragt, müssen nicht derselbe sein.
          # Fehlt sie, gilt die aus dem Impressum.
          ASC_KONTAKT_MAIL: ${{ secrets.ASC_KONTAKT_MAIL }}
        run: |
          if [ "${{ inputs.fuellen }}" = "true" ]; then
            python3 scripts/asc-einreichung.py --fuellen
          else
            python3 scripts/asc-einreichung.py
          fi
