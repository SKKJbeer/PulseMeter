# Beschreibung des Xcode-Projekts für XcodeGen.
#
# Warum generiert statt eingecheckt: Eine .xcodeproj-Datei ist ein
# unübersichtliches Gebilde, das bei jeder Änderung Zeilen umsortiert und
# Zusammenführungen unnötig schwer macht. Diese Datei ist die Wahrheit; das
# Projekt entsteht daraus mit `scripts/setup-mac.sh` oder `xcodegen generate`.
#
# Folge: PulseMeter.xcodeproj gehört nicht ins Repository (siehe .gitignore).

name: PulseMeter
options:
  bundleIdPrefix: de.karjoth
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  PulseCore:
    path: Packages/PulseCore
  PulseData:
    path: Packages/PulseData
  PulseUI:
    path: Packages/PulseUI

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Die Push-Umgebung für `aps-environment` in den Berechtigungsdateien.
    # SwiftData meldet Änderungen aus iCloud über eine stille Mitteilung, und
    # der Wert muss zur Art des Profils passen: Ein Gerätebau signiert mit
    # einem Entwicklungsprofil und braucht `development`, ein Store-Bau ein
    # Verteilprofil und `production`. Fest eingetragen wäre einer von beiden
    # immer falsch — der erste TestFlight-Lauf ist genau daran vorbeigelaufen.
    APS_ENVIRONMENT: development
    # Die Berechtigungsdateien hängen an Variablen, damit ein Lauf sie
    # abschalten kann. Der erste TestFlight-Bau tut das: App-Gruppe, iCloud
    # und Push müssen an der App-ID im Portal freigeschaltet sein, sonst lehnt
    # Apple das Profil ab — und die zwei Wochen Eigennutzung sind wichtiger
    # als der Abgleich (docs/07-v1-plan.md).
    PULSE_ENTITLEMENTS_APP: App/PulseMeter.entitlements
    PULSE_ENTITLEMENTS_WIDGET: Widget/PulseWidget.entitlements
    # Leer = automatische Signierung, wie im Simulator und in der CI.
    PULSE_PROFILE_APP: ""
    PULSE_PROFILE_WIDGET: ""
  configs:
    Release:
      APS_ENVIRONMENT: production

targets:
  PulseMeter:
    type: application
    platform: iOS
    sources:
      - path: App
      # Das Icon. Erzeugt aus `scripts/icon.mjs`, nicht von Hand gepflegt —
      # drei Erscheinungsbilder aus einer Zeichnung, damit sie nicht
      # auseinanderlaufen.
      - path: Assets.xcassets
      # Die Brücke zum Widget liegt in Shared, weil beide Ziele sie brauchen.
      # Zweimal übersetzt statt zweimal geschrieben: Eine zweite Fassung
      # zeigte früher oder später eine andere Zahl als die erste.
      - path: Shared
    dependencies:
      - package: PulseCore
      - package: PulseData
      - package: PulseUI
      - target: PulseWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.karjoth.pulsemeter
        PRODUCT_NAME: PulseMeter
        MARKETING_VERSION: "0.113.2"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # **iPhone und iPad**, seit 0.112.0.
        #
        # Stand von 0.37.0 bis dahin auf `"1"`, und das war richtig so: Apple
        # hätte zur Einreichung iPad-Bilder verlangt und die App **auf** einem
        # iPad geprüft, die Ansichten waren aber für eine Hand gebaut. Eine auf
        # 13 Zoll gezogene Telefonoberfläche holt sich eine schlechte
        # Bewertung, und die steht länger als der Fehler.
        #
        # Was sich geändert hat, ist nicht der Schalter, sondern die
        # Oberfläche: `RootView` schaltet auf breiten Fenstern von der
        # Tableiste auf eine Seitenleiste, und die Übersicht setzt ihre Karten
        # ins Raster statt untereinander. Der Schalter allein wäre genau der
        # Fehler von 0.37.0, nur ein zweites Mal.
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        # Signieren ist für den Simulator nicht nötig. Auf einem echten Gerät
        # trägt Xcode das Team ein; dann gehört es hierher.
        CODE_SIGNING_ALLOWED: NO
        # **Je Ziel, nicht auf der Kommandozeile.** Eine Bauvorgabe auf der
        # Kommandozeile gilt für alle Ziele auf einmal — das Widget bekäme dann
        # die iCloud-Berechtigung der App, die seine eigene Kennung nicht hat.
        # Wirksam wird die Datei erst, wenn signiert wird, also beim Gerätebau
        # über `scripts/aufs-handy.sh`; Simulator und CI signieren nicht.
        CODE_SIGN_ENTITLEMENTS: $(PULSE_ENTITLEMENTS_APP)
        # **Manuelle Signierung je Ziel.** `xcodebuild archive` mit
        # automatischer Signierung besorgt sich ein *Development*-Profil und
        # verlangt dafür ein registriertes Gerät — ein Konto ohne Gerät bekommt
        # keins, und daran sind die TestFlight-Läufe 1 und 2 gescheitert. Der
        # Name kommt aus einer Variablen, weil er je Ziel ein anderer ist und
        # eine Bauvorgabe auf der Kommandozeile für alle Ziele gälte.
        # Leer heißt: automatisch, wie bisher — Simulator und CI bleiben
        # unberührt.
        PROVISIONING_PROFILE_SPECIFIER: $(PULSE_PROFILE_APP)

  PulseWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    dependencies:
      - package: PulseCore
      - package: PulseUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.karjoth.pulsemeter.widget
        PRODUCT_NAME: PulseWidget
        # Ausdrücklich, nicht über die Vorgabe: Eine Erweiterung, die weniger
        # Geräte trägt als die App, lehnt Apple beim Hochladen ab — und die
        # Meldung nennt das Widget nicht.
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.113.2"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
        # Nur die App-Gruppe. Die Erweiterung spricht nie mit CloudKit — sie
        # liest, was die App zuletzt im gemeinsamen Ordner hinterlegt hat.
        CODE_SIGN_ENTITLEMENTS: $(PULSE_ENTITLEMENTS_WIDGET)
        PROVISIONING_PROFILE_SPECIFIER: $(PULSE_PROFILE_WIDGET)

  PulseMeterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: PulseMeter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.karjoth.pulsemeter.uitests
        CODE_SIGNING_ALLOWED: NO

schemes:
  PulseMeter:
    build:
      targets:
        PulseMeter: all
        PulseWidgetExtension: all
        PulseMeterUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PulseMeterUITests
